<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard de Red</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .card {
      background: white;
      padding: 15px;
      margin: 10px auto;
      border-radius: 8px;
      width: 300px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .online {
      color: green;
      font-weight: bold;
    }
    .offline {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h1>📡 Monitoreo de Red</h1>
<div id="contenedor"></div>

<script>
async function cargarEstado() {
  const res = await fetch('/api/status');
  const datos = await res.json();

  const contenedor = document.getElementById('contenedor');
  contenedor.innerHTML = '';

  datos.forEach(d => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <h3>${d.nombre}</h3>
      <p>IP: ${d.ip}</p>
      <p class="${d.estado}">Estado: ${d.estado}</p>
    `;
    contenedor.appendChild(div);
  });
}

cargarEstado();
setInterval(cargarEstado, 5000);
</script>

</body>
</html>
