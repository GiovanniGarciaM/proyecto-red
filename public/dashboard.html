<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Monitoreo de Red</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      width: 220px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .online {
      border-left: 6px solid #2ecc71;
    }

    .offline {
      border-left: 6px solid #e74c3c;
    }

    .estado {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>📡 Monitoreo de Red</h1>

  <!-- CONTENEDOR DONDE SE PINTAN LAS TARJETAS -->
  <div id="equipos" class="grid"></div>
  <script>
function formatearHoraLocal(fechaISO) {
  if (!fechaISO) return "Sin datos";

  const fecha = new Date(fechaISO);
  return fecha.toLocaleString(); 
}
</script>

  <script>
    async function cargarEstado() {
      try {
        const res = await fetch('/api/status');
        const equipos = await res.json();

        const contenedor = document.getElementById('equipos');
        contenedor.innerHTML = '';

        equipos.forEach(e => {
          const tarjeta = document.createElement('div');
          tarjeta.className = 'card ' + (e.estado === 'online' ? 'online' : 'offline');

          tarjeta.innerHTML = `
            <h3>${e.nombre}</h3>
            <p>IP: ${e.ip}</p>
            <p>Ultima Respuesta: ${e.ultimoPing}</p>
            <div class="estado">${e.estado.toUpperCase()}</div>
          `;

          contenedor.appendChild(tarjeta);
        });

      } catch (error) {
        console.error('Error al cargar estado:', error);
      }
    }

    // Cargar al iniciar
    cargarEstado();

    // Actualizar cada 10 segundos
    setInterval(cargarEstado, 10000);
  </script>

</body>
</html>
