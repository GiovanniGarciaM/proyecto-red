<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Monitoreo de Red</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    #equipos {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      width: 260px;
      background: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border-left: 6px solid gray;
    }

    .online {
      border-left-color: #2ecc71;
    }

    .offline {
      border-left-color: #e74c3c;
    }

    .nombre {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 5px;
    }

    .ip {
      color: #555;
      margin-bottom: 5px;
    }

    .estado {
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h1>📡 Monitoreo de Red</h1>

  <div id="equipos"></div>

  <script>
    function formatearHoraLocal(fechaISO) {
      if (!fechaISO) return "Sin datos";
      const fecha = new Date(fechaISO);
      return fecha.toLocaleString("es-MX");
    }

    async function cargarEquipos() {
      try {
        const response = await fetch("/api/status");
        const equipos = await response.json();

        const contenedor = document.getElementById("equipos");
        contenedor.innerHTML = "";

        equipos.forEach(equipo => {
          const card = document.createElement("div");
          card.classList.add("card");

          if (equipo.estado === "online") {
            card.classList.add("online");
          } else {
            card.classList.add("offline");
          }

          card.innerHTML = `
            <div class="nombre">${equipo.nombre}</div>
            <div class="ip">IP: ${equipo.ip}</div>
            <div>Última Respuesta: ${formatearHoraLocal(equipo.ultimaRespuesta)}</div>
            <div class="estado">${equipo.estado.toUpperCase()}</div>
          `;

          contenedor.appendChild(card);
        });

      } catch (error) {
        console.error("Error cargando equipos:", error);
      }
    }

    cargarEquipos();
    setInterval(cargarEquipos, 10000); // cada 10 segundos
  </script>

</body>
</html>
